[project]
name = "msp-triage-agent"
version = "0.1.0"
description = "Evals-first AI support-ticket triage agent for a fictional managed service provider."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "evals"]

[tool.hatch.build.targets.wheel.force-include]
"kb" = "kb"

[tool.pytest.ini_options]
testpaths = ["tests"]
