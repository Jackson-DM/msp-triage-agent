<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d13">
  <title>Where the Rules Live — Narrated Walkthrough</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090d13;
      color: #f4f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 52px);
      background:
        radial-gradient(circle at 15% 10%, rgba(206, 139, 57, 0.12), transparent 28rem),
        radial-gradient(circle at 85% 90%, rgba(77, 109, 163, 0.12), transparent 32rem),
        #090d13;
    }

    main {
      width: min(1180px, 100%);
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #d89a4e;
      font: 600 0.76rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 3.1rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .meta {
      flex: 0 0 auto;
      color: #9aa7ba;
      font-size: 0.9rem;
    }

    .frame {
      overflow: hidden;
      border: 1px solid #263141;
      border-radius: 14px;
      background: #030508;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #030508;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 22px;
      margin-top: 18px;
      color: #aeb8c7;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    footer p { margin: 0; }

    a {
      color: #e4ad68;
      text-decoration-color: rgba(228, 173, 104, 0.45);
      text-underline-offset: 3px;
    }

    a:hover { text-decoration-color: currentColor; }

    @media (max-width: 700px) {
      header, footer { display: block; }
      .meta { margin-top: 10px; }
      footer p + p { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Summit Managed IT · Visual walkthrough</p>
        <h1>Where the Rules Live</h1>
      </div>
      <div class="meta">2:17 · Narrated</div>
    </header>

    <div class="frame">
      <video controls playsinline preload="metadata" poster="assets/where-the-rules-live-thumbnail.png">
        <source src="https://github.com/Jackson-DM/msp-triage-agent/releases/download/where-the-rules-live-v1/where-the-rules-live.mp4" type="video/mp4">
        Your browser does not support embedded MP4 video.
        <a href="https://github.com/Jackson-DM/msp-triage-agent/releases/download/where-the-rules-live-v1/where-the-rules-live.mp4">Download the narrated walkthrough</a>.
      </video>
    </div>

    <footer>
      <p>Visual storytelling made with Claude Design. Narration made with ElevenLabs.</p>
      <p><a href="where-the-rules-live.html">Open the interactive visual version →</a></p>
    </footer>
  </main>
</body>
</html>
